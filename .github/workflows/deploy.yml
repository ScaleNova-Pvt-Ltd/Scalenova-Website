name: Deploy ScaleNova Website to OrangeHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate & Deploy to OrangeHost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Verify Essential Website Files Exist
        run: |
          echo "Checking essential production files..."
          REQUIRED_FILES=(
            "index.html"
            "features/index.html"
            "plans/index.html"
            "blog/index.html"
            "careers/index.html"
            "affiliate/index.html"
            "contact/index.html"
            "privacy/index.html"
            "terms/index.html"
            "refunds/index.html"
            "css/style.css"
            "css/components.css"
            "js/config.js"
            "js/features-data.js"
            "js/plans-data.js"
            "js/careers-data.js"
            "js/affiliate-data.js"
            "js/blog-data.js"
            "js/pricing.js"
            "js/modal-engine.js"
            "js/forms-service.js"
            "js/3d-hero.js"
            "js/app.js"
            "sitemap.xml"
            "robots.txt"
            "404.html"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing required production file: $file"
              exit 1
            fi
            echo "  ✓ $file"
          done
          echo "All essential files present."

      - name: Validate JavaScript Syntax
        run: |
          echo "Validating JavaScript syntax across all modules..."
          node -c js/config.js
          node -c js/features-data.js
          node -c js/plans-data.js
          node -c js/careers-data.js
          node -c js/affiliate-data.js
          node -c js/blog-data.js
          node -c js/pricing.js
          node -c js/modal-engine.js
          node -c js/forms-service.js
          node -c js/3d-hero.js
          node -c js/app.js
          echo "All JavaScript modules verified with 0 syntax errors."

      - name: Verify Asset References in index.html
        run: |
          echo "Verifying local script and stylesheet links in index.html..."
          for raw_asset in $(grep -oE '(href|src)="[^"]+"' index.html | cut -d'"' -f2 | grep -v '^http' | grep -v '^#' | grep -v '^mailto:' | grep -v '^tel:'); do
            clean_asset=$(echo "$raw_asset" | cut -d'?' -f1)
            if [ ! -f "$clean_asset" ] && [ ! -d "$clean_asset" ]; then
              echo "::warning file=index.html::Referenced asset '$clean_asset' (from '$raw_asset') not found locally."
            else
              echo "  ✓ Linked asset exists: $clean_asset"
            fi
          done

      - name: Verify Deployment Configuration Secrets
        run: |
          if [ -z "${{ secrets.FTP_HOST }}" ]; then
            echo "::error title=Missing Secret::GitHub Secret 'FTP_HOST' is empty or not set."
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "::error title=Missing Secret::GitHub Secret 'FTP_USERNAME' is empty or not set."
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error title=Missing Secret::GitHub Secret 'FTP_PASSWORD' is empty or not set."
            exit 1
          fi
          echo "✓ Required FTP secrets are configured."

      - name: Deploy to OrangeHost public_html (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          local-dir: ./
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/README.md
            **/.gitignore
            **/.DS_Store
